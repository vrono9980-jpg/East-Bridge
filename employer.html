<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Dashboard | EastBridge Jobs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; color: #0f172a; }
        .header { background: #0b2b26; color: white; padding: 1rem 0; }
        .container { max-width: 1300px; margin: 0 auto; padding: 0 24px; }
        .header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo i { font-size: 2rem; color: #f5c542; }
        .logo h1 { font-size: 1.5rem; }
        .nav-links a { color: #e2e8f0; margin-left: 28px; text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: #f5c542; }
        .hero { background: white; padding: 1.5rem 0; border-bottom: 1px solid #e2e8f0; margin-bottom: 2rem; }
        .filter-bar { background: white; border-radius: 60px; padding: 0.5rem; display: inline-flex; gap: 8px; margin-bottom: 2rem; flex-wrap: wrap; }
        .filter-btn { background: #f1f5f9; border: none; padding: 10px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .filter-btn.active { background: #0b2b26; color: white; }
        .stats { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-card { background: white; border-radius: 24px; padding: 1rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.05); flex: 1; min-width: 140px; }
        .applicant-table { background: white; border-radius: 28px; overflow-x: auto; padding: 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 1rem 1.2rem; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; font-weight: 700; color: #1e293b; }
        .badge-country { padding: 4px 12px; border-radius: 30px; font-size: 0.75rem; font-weight: 600; background: #eef2ff; }
        .empty-row td { padding: 3rem; text-align: center; color: #64748b; }
        footer { text-align: center; padding: 2rem; font-size: 0.8rem; color: #475569; margin-top: 2rem; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #0b2b26; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-update { background: #0b2b26; color: white; border: none; padding: 4px 12px; border-radius: 20px; cursor: pointer; font-size: 0.7rem; }
        .btn-update:hover { background: #1e4a3b; }
        @media (max-width: 700px) { th, td { padding: 0.75rem; } .filter-bar { border-radius: 20px; } }
    </style>
</head>
<body>
<header class="header">
    <div class="container">
        <div class="logo"><i class="fas fa-building"></i><h1>EastBridge Employer Hub</h1></div>
        <div class="nav-links">
            <a href="index.html"><i class="fas fa-home"></i> Home</a>
            <a href="dashboard.html"><i class="fas fa-chart-line"></i> My Status</a>
            <a href="employer.html" class="active"><i class="fas fa-users"></i> Employer</a>
            <a href="payment.html"><i class="fas fa-credit-card"></i> Payment</a>
            <a href="payment-admin.html"><i class="fas fa-shield-alt"></i> Payments Admin</a>
        </div>
    </div>
</header>

<section class="hero">
    <div class="container">
        <h2><i class="fas fa-rectangle-ad"></i> Recruiter dashboard</h2>
        <p>Manage applications from Kenyan & Ugandan candidates for Qatar, Australia, Lebanon.</p>
    </div>
</section>

<div class="container">
    <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all">All Countries</button>
        <button class="filter-btn" data-filter="Qatar">🇶🇦 Qatar</button>
        <button class="filter-btn" data-filter="Australia">🇦🇺 Australia</button>
        <button class="filter-btn" data-filter="Lebanon">🇱🇧 Lebanon</button>
    </div>
    <div class="stats" id="statsContainer"></div>
    <div class="applicant-table">
        <table id="applicantTable">
            <thead>
                <tr><th>Name</th><th>Country</th><th>Job Role</th><th>Nationality</th><th>Email</th><th>Phone</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>
<footer><p>EastBridge Jobs – real-time applicant data from Supabase.</p></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ============================================
    // SUPABASE CONFIGURATION
    // ============================================
    const SUPABASE_URL = 'https://aynzlevzajumfvlubxyg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_jjHdEPMij6nkXShaOck-2A_xR8p36ZE';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentFilter = "all";
    let allApplications = [];

    async function loadApplications() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:2rem;"><div class="loading-spinner"></div> Loading applications...</td></tr>`;

        try {
            const { data, error } = await supabase
                .from('applications')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            allApplications = data || [];
            renderStats();
            renderTable();

        } catch (error) {
            console.error('Error loading applications:', error);
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:2rem; color:#991b1b;">Failed to load applications. Please refresh.</td></tr>`;
        }
    }

    function renderStats() {
        const statsContainer = document.getElementById('statsContainer');
        const total = allApplications.length;
        const qatar = allApplications.filter(a => a.preferred_country === "Qatar").length;
        const australia = allApplications.filter(a => a.preferred_country === "Australia").length;
        const lebanon = allApplications.filter(a => a.preferred_country === "Lebanon").length;
        const pending = allApplications.filter(a => a.status === 'pending').length;

        statsContainer.innerHTML = `
            <div class="stat-card"><i class="fas fa-users"></i> <strong>Total</strong><br>${total} applicants</div>
            <div class="stat-card"><i class="fas fa-map-marker-alt"></i> 🇶🇦 Qatar<br>${qatar}</div>
            <div class="stat-card"><i class="fas fa-map-marker-alt"></i> 🇦🇺 Australia<br>${australia}</div>
            <div class="stat-card"><i class="fas fa-map-marker-alt"></i> 🇱🇧 Lebanon<br>${lebanon}</div>
            <div class="stat-card"><i class="fas fa-clock"></i> Pending<br>${pending}</div>
        `;
    }

    function renderTable() {
        let filtered = allApplications;
        if (currentFilter !== "all") {
            filtered = allApplications.filter(app => app.preferred_country === currentFilter);
        }

        const tbody = document.getElementById('tableBody');
        if (filtered.length === 0) {
            tbody.innerHTML = `<tr class="empty-row"><td colspan="8">No applications found for this filter.</td></tr>`;
            return;
        }

        let html = '';
        filtered.forEach(app => {
            const date = new Date(app.created_at).toLocaleDateString();
            const statusMap = {
                'pending': '⏳ Pending',
                'approved': '✅ Approved',
                'rejected': '❌ Rejected'
            };
            const statusText = statusMap[app.status] || app.status;

            html += `
                <tr>
                    <td><strong>${escapeHtml(app.full_name)}</strong></td>
                    <td><span class="badge-country">${escapeHtml(app.preferred_country)}</span></td>
                    <td>${escapeHtml(app.job_title)}</td>
                    <td>${escapeHtml(app.nationality)}</td>
                    <td>${escapeHtml(app.email)}</td>
                    <td>${escapeHtml(app.phone)}</td>
                    <td>${statusText}</td>
                    <td>
                        <select class="status-select" data-id="${app.id}" style="padding:4px 8px; border-radius:20px; border:1px solid #cbd5e1;">
                            <option value="pending" ${app.status === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="approved" ${app.status === 'approved' ? 'selected' : ''}>Approved</option>
                            <option value="rejected" ${app.status === 'rejected' ? 'selected' : ''}>Rejected</option>
                        </select>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;

        // Attach event listeners to status selectors
        document.querySelectorAll('.status-select').forEach(select => {
            select.addEventListener('change', async function() {
                const id = this.dataset.id;
                const newStatus = this.value;
                await updateApplicationStatus(id, newStatus);
            });
        });
    }

    async function updateApplicationStatus(id, status) {
        try {
            const { error } = await supabase
                .from('applications')
                .update({ status: status })
                .eq('id', id);

            if (error) throw error;

            // Refresh the table
            await loadApplications();
            showToast(`Application status updated to ${status}`, 'success');

        } catch (error) {
            console.error('Error updating status:', error);
            showToast('Failed to update status. Please try again.', 'error');
        }
    }

    function showToast(message, type) {
        const toast = document.createElement('div');
        toast.style.cssText = `
            position: fixed; bottom: 20px; right: 20px; padding: 16px 24px;
            border-radius: 40px; font-weight: 600; z-index: 1000;
            background: ${type === 'success' ? '#dcfce7' : '#fee2e2'};
            color: ${type === 'success' ? '#166534' : '#991b1b'};
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            animation: slideIn 0.3s ease;
        `;
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = '0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.getAttribute('data-filter');
            renderTable();
        });
    });

    // Load data on page load
    loadApplications();

    // Add slide-in animation
    const style = document.createElement('style');
    style.textContent = `
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    `;
    document.head.appendChild(style);
</script>
</body>
</html>
